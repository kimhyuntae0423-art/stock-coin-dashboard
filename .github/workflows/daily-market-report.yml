name: 매일 시장 요약 카카오톡 발송

on:
  schedule:
    # 매일 00:30 UTC = 09:30 KST
    - cron: "30 0 * * *"
  workflow_dispatch:   # GitHub UI 수동 실행 가능

permissions:
  contents: write   # market_report_state.json 커밋용 (2026-08-25, 국면 지속일수/변화 추적 추가하며 필요해짐)

concurrency:
  group: daily-market-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Node.js 20 설치
        # 2026-08-25: 뉴스 근거 인사이트(_news_grounded_insight)가 Claude Code
        # CLI를 헤드리스로 서브프로세스 호출하기 때문에 필요. Console API
        # (ANTHROPIC_API_KEY, 종량제)는 처음 시도했다가 "추가금 내기 싫다"는
        # 이유로 폐기 — 이미 쓰는 Claude Code 구독 기반 OAuth 토큰으로 대체.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 시장 요약 발송
        env:
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          # `claude setup-token`으로 발급한 구독 기반 1년 토큰. 없어도 뉴스
          # 단락만 조용히 생략되고 나머지 3단락은 그대로 발송됨.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/daily_market_report.py

      - name: 국면 지속일수/변화 상태 커밋 & 푸시
        # 2026-08-25: build_message()가 results/market_report_state.json에
        # 오늘 국면·streak을 저장하는데, 이 워크플로우엔 원래 커밋 스텝이
        # 없어서 러너 종료와 함께 매번 그냥 사라졌음(다음날도 "처음 실행"
        # 상태로 리셋 — "며칠째 이어지는지" 추적이 실제로는 전혀 안 되는
        # 상태였음). daily-update.yml의 cycle_alert_state.json 커밋 패턴과 동일.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/market_report_state.json
          if git diff --cached --quiet; then
            echo "국면 상태 변경 없음 — 커밋 스킵"
          else
            git commit -m "state: 시장 조각글 국면 상태 갱신"
            git pull --rebase origin main || true
            git push
          fi

      - name: 카카오 토큰 갱신 시 두 레포 시크릿 동기화
        if: hashFiles('new_tokens.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_ACCESS=$(python -c "import json; d=json.load(open('new_tokens.json')); print(d['access_token'])")
          NEW_REFRESH=$(python -c "import json; d=json.load(open('new_tokens.json')); print(d.get('refresh_token',''))")
          [ -n "$NEW_ACCESS" ]  && echo "$NEW_ACCESS"  | gh secret set KAKAO_ACCESS_TOKEN  -R kimhyuntae0423-art/stock-coin-dashboard
          [ -n "$NEW_REFRESH" ] && echo "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN -R kimhyuntae0423-art/stock-coin-dashboard
          [ -n "$NEW_ACCESS" ]  && echo "$NEW_ACCESS"  | gh secret set KAKAO_ACCESS_TOKEN  -R kimhyuntae0423-art/morning-briefing
          [ -n "$NEW_REFRESH" ] && echo "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN -R kimhyuntae0423-art/morning-briefing
          echo "두 레포 시크릿 업데이트 완료"
