name: 매일 데이터 자동 갱신

on:
  schedule:
    # 매일 22:00 UTC = 다음날 07:00 KST (미국 장 마감 후)
    - cron: "0 22 * * *"
  workflow_dispatch:   # GitHub UI에서 수동 실행 가능

permissions:
  contents: write       # results/ 커밋용

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 분석 실행
        run: python run_analysis.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ asset_reports.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않음"
          else
            git commit -m "data: 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 사용자가 사이에 push했을 가능성에 대비
            git pull --rebase origin main || true
            git push
          fi

      - name: 보유종목 매도/주의 + BTC 사이클 단계 변경 → 카카오톡 알림
        continue-on-error: true
        env:
          KAKAO_ACCESS_TOKEN:  ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python scripts/check_alerts.py

      - name: 카카오 토큰 갱신 시 두 레포 시크릿 동기화
        if: hashFiles('new_tokens.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_ACCESS=$(python -c "import json; d=json.load(open('new_tokens.json')); print(d['access_token'])")
          NEW_REFRESH=$(python -c "import json; d=json.load(open('new_tokens.json')); print(d.get('refresh_token',''))")
          [ -n "$NEW_ACCESS" ]  && echo "$NEW_ACCESS"  | gh secret set KAKAO_ACCESS_TOKEN  -R kimhyuntae0423-art/stock-coin-dashboard
          [ -n "$NEW_REFRESH" ] && echo "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN -R kimhyuntae0423-art/stock-coin-dashboard
          [ -n "$NEW_ACCESS" ]  && echo "$NEW_ACCESS"  | gh secret set KAKAO_ACCESS_TOKEN  -R kimhyuntae0423-art/morning-briefing
          [ -n "$NEW_REFRESH" ] && echo "$NEW_REFRESH" | gh secret set KAKAO_REFRESH_TOKEN -R kimhyuntae0423-art/morning-briefing
          echo "두 레포 시크릿 업데이트 완료"

      - name: 사이클 상태 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cycle_alert_state.json
          if git diff --cached --quiet; then
            echo "사이클 단계 변경 없음 — 커밋 스킵"
          else
            git commit -m "alert: BTC 사이클 단계 변경 기록"
            git pull --rebase origin main || true
            git push
          fi
